name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-service:
    name: api_service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api_service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api_service/package-lock.json

      - run: npm ci

      - run: npx prisma generate

      - run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - run: npm test

  search-service:
    name: search_service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: search_service
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test?schema=core
      JWT_SECRET: test-jwt-secret
      QDRANT_URL: http://localhost:6333
      REDIS_URL: redis://localhost:6379
      MQ_URL: amqp://guest:guest@localhost:5672
      GRPC_URL: localhost:50052
      CLOUDFRONT_DOMAIN_NAME: example.cloudfront.net
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: search_service/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: bash src/infrastructure/grpc/generate_proto.sh

      - run: prisma generate

      - run: pytest
