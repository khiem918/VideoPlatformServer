name: e2e

on:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Write staging.env
        working-directory: docker
        run: |
          cp staging.env.example staging.env
          sed -i "s#^S3_REGION=.*#S3_REGION=${{ secrets.E2E_S3_REGION }}#" staging.env
          sed -i "s#^S3_ACCESS_KEY_ID=.*#S3_ACCESS_KEY_ID=${{ secrets.E2E_S3_ACCESS_KEY_ID }}#" staging.env
          sed -i "s#^S3_SECRET_ACCESS_KEY=.*#S3_SECRET_ACCESS_KEY=${{ secrets.E2E_S3_SECRET_ACCESS_KEY }}#" staging.env
          sed -i "s#^BUCKET_NAME=.*#BUCKET_NAME=${{ secrets.E2E_BUCKET_NAME }}#" staging.env
          sed -i "s#^CLOUDFLARE_R2_ENDPOINT=.*#CLOUDFLARE_R2_ENDPOINT=${{ secrets.E2E_R2_ENDPOINT }}#" staging.env

      - name: Start staging stack
        run: docker compose -f docker/docker-compose.staging.yml up -d --build --wait

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install e2e suite deps
        working-directory: test
        run: npm ci

      - name: Run e2e suite
        working-directory: test
        run: npm test

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f docker/docker-compose.staging.yml logs

      - name: Tear down staging stack
        if: always()
        run: docker compose -f docker/docker-compose.staging.yml down -v
