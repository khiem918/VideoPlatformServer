services:
  postgres:
    image: postgres:16
    container_name: video_platform_search_db
    restart: unless-stopped
    ports:
      - "5438:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: video_streaming_search
    volumes:
      - pgdata:/var/lib/postgresql/searchservicedata

volumes:
  pgdata:
