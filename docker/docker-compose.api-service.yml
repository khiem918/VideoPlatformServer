services:
  postgres:
    image: postgres:16
    container_name: video_platform_api_db
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: video_streaming_api
    volumes:
      - pgdata:/var/lib/postgresql/apiservicedata

  redis:
    image: redis:7-alpine
    container_name: video-platform-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.13.6
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: video-platform-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  api_service:
    image: ${ECR_REGISTRY}/api-service:latest
    container_name: video-platform-api
    restart: unless-stopped
    env_file:
      - .env.api
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
      - qdrant
      - rabbitmq

volumes:
  pgdata:
  redis_data:
  qdrant_storage:
  rabbitmq_data:
