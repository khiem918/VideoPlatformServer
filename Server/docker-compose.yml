services:
  postgres:
    image: postgres:16
    container_name: video_platform_db
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: video_streaming
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: